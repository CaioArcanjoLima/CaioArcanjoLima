<svg xmlns="http://www.w3.org/2000/svg" width="700" height="150" viewBox="0 0 700 150" role="img" aria-labelledby="title desc">
  <title id="title">Colossians 3:23</title>
  <desc id="desc">Whatever you do, work at it with all your heart, as working for the Lord, not for human masters.</desc>
  <rect width="700" height="150" rx="13" fill="#151515"/>
  <text x="22" y="42" fill="#54e38e" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="bold">“</text>
  <text x="42" y="42" fill="#c9c9c9" font-family="Arial, Helvetica, sans-serif" font-size="18" font-style="italic">Whatever you do, work at it with all your heart,</text>
  <text x="42" y="68" fill="#c9c9c9" font-family="Arial, Helvetica, sans-serif" font-size="18" font-style="italic">as working for the Lord, not for human masters.</text>
  <text x="42" y="94" fill="#c9c9c9" font-family="Arial, Helvetica, sans-serif" font-size="18" font-style="italic">”</text>
  <text x="678" y="129" text-anchor="end" fill="#f0f0f0" font-family="Arial, Helvetica, sans-serif" font-size="16" font-style="italic">— Colossians 3:23</text>
</svg>
