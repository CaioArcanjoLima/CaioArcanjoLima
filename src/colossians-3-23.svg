

<svg xmlns="http://www.w3.org/2000/svg" width="700" height="150" viewBox="0 0 700 150">
  <rect width="700" height="150" rx="14" fill="#151515"/>

  <text x="22" y="42" font-family="Arial, sans-serif" font-size="30" font-weight="bold" fill="#57F287">“</text>

  <text x="46" y="42" font-family="Arial, sans-serif" font-size="18" font-style="italic" fill="#D8D8D8">
